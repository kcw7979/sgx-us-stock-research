[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "equity-research"
version = "0.1.0"
description = "Cloud-first SGX and US equity research; no trade execution"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pandas>=2.2,<3", "numpy>=2,<3", "openpyxl>=3.1,<4",
  "streamlit>=1.49,<2", "yfinance>=0.2.54,<1",
  "pandas-market-calendars>=5,<6", "pyarrow>=19,<24",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
equity-refresh = "equity_research.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
